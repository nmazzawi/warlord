<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1a1410" />
    <title>Warlord</title>
    <style>
      :root { --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px);
              --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); }
      /* Fill the whole screen, kill scrolling/bounce/zoom so the thumb owns the canvas. */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #1a1410; overflow: hidden; }
      body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none;
             -webkit-touch-callout: none; overscroll-behavior: none; }
      #game { width: 100%; height: 100%; }
      canvas { display: block; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
